<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoedown - Video Manager</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
}

header{
    padding:20px;
    text-align:center;
    background:#111827;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.logo{
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:#38bdf8;
}

.container{
    width:90%;
    max-width:1000px;
    margin:auto;
    padding:30px 0;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
}

.upload-area{
    border:2px dashed #38bdf8;
    border-radius:15px;
    padding:40px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
}

.upload-area:hover{
    background:#0f172a;
}

input[type=file]{
    display:none;
}

video{
    width:100%;
    margin-top:20px;
    border-radius:15px;
}

.info{
    margin-top:15px;
    line-height:1.8;
}

.btn{
    margin-top:15px;
    display:inline-block;
    padding:12px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#38bdf8;
    color:black;
    font-weight:bold;
}

.status-box{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    background:#0f172a;
}

footer{
    text-align:center;
    padding:20px;
    opacity:.7;
}
</style>
</head>

<body>

<header>
    <div class="logo">Hoe<span>down</span></div>
    <p>Upload & Preview Video</p>
    <header class="hero">
    <h1>HOEDOWN</h1>
    <p>Upload, Preview & Manage Video</p>

    <div class="search-box">
        <input type="text" placeholder="Masukkan URL video (.mp4)">
        <button>Import</button>
    </div>
    <div class="upload-card">
    <label for="videoInput">
        <div class="upload-content">
            <h2>📹 Upload Video</h2>
            <p>Pilih video dari perangkat</p>
        </div>
    </label>

    <input type="file" id="videoInput" hidden>
</div>
</header>
</header>

<div class="container">

    <div class="card">

        <label class="upload-area">
            <h2>📹 Upload Video</h2>
            <p>Klik untuk memilih video</p>
            <input type="file" id="videoInput" accept="video/*">
        </label>

        <video id="preview" controls style="display:none"></video>

        <div class="info" id="videoInfo"></div>

        <button class="btn" id="saveBtn" style="display:none">
            Simpan Video
        </button>

        <div class="status-box">
            <h3>Status WhatsApp</h3>
            <p>
                Video akan diputar menggunakan file asli yang dipilih.
                Kualitas akhir saat diunggah ke WhatsApp tetap mengikuti
                proses kompresi dari WhatsApp.
            </p>
        </div>

    </div>

</div>

<footer>
    Hoedown © 2026
</footer>

<script>
const input = document.getElementById("videoInput");
const preview = document.getElementById("preview");
const info = document.getElementById("videoInfo");
const saveBtn = document.getElementById("saveBtn");

let currentFile = null;

input.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    currentFile = file;

    const url = URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

    const sizeMB = (file.size / 1024 / 1024).toFixed(2);

    preview.onloadedmetadata = () => {

        info.innerHTML = `
        <strong>Nama:</strong> ${file.name}<br>
        <strong>Ukuran:</strong> ${sizeMB} MB<br>
        <strong>Durasi:</strong> ${Math.floor(preview.duration)} detik<br>
        <strong>Resolusi:</strong> ${preview.videoWidth} x ${preview.videoHeight}
        `;

        saveBtn.style.display = "inline-block";
    };
});

saveBtn.addEventListener("click", () => {

    if(!currentFile) return;

    const link = document.createElement("a");

    link.href = URL.createObjectURL(currentFile);
    link.download = currentFile.name;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

});
</script>

</body>
</html>
